name: jlpt_n2_app
description: "JLPT N2 학습 앱 — 회차별 풀이, 영역별 모아풀기, 청해, 단어장."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  just_audio: ^0.9.42
  audio_session: ^0.1.21
  html: ^0.15.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#F97316"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/data/exams/
    # N2 음원이 들어오면 회차별 폴더 추가:
    # - assets/audio/n2_2025-07/
    # - assets/audio/n2_2024-12/
    # ...
